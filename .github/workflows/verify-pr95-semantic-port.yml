name: Verify PR95 semantic port

on:
  push:
    branches:
      - verify/pr95-semantic-port-20260917

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install Tuist
        run: |
          curl -fsSL https://github.com/tuist/tuist/releases/download/4.206.0/tuist.zip -o /tmp/tuist.zip
          mkdir -p /tmp/tuist
          unzip -q /tmp/tuist.zip -d /tmp/tuist
          chmod +x /tmp/tuist/tuist
          /tmp/tuist/tuist version

      - name: Generate Xcode workspace
        run: /tmp/tuist/tuist generate --no-open

      - name: Build app for iOS Simulator
        run: |
          xcodebuild build \
            -workspace HermesMobile.xcworkspace \
            -scheme HermesMobile \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test HermesKit
        working-directory: HermesKit
        run: |
          swift test --filter LaunchIntentTests --skip PushClientTests
          swift test --filter SlotGenerationTests --skip PushClientTests
          swift test --skip PushClientTests
        env:
          SWIFT_DETERMINISTIC_TESTS: 1

      # The full app-target XCTest suite is not a reliable headless CI gate: clean upstream
      # has 54 baseline failures across snapshot/layout suites. Keep this proven narrow filter.
      - name: Test composer paste timing (flake check)
        run: |
          xcodebuild test \
            -workspace HermesMobile.xcworkspace \
            -scheme HermesMobile \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:HermesMobileTests/ComposerTextViewTests
